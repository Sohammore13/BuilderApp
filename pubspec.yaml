name: builder_app
description: "Construction company management app with role-based access."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  google_fonts: ^8.0.2
  http: ^1.6.0
  http_parser: ^4.1.0
  image_picker: ^1.2.1
  file_picker: ^10.3.10
  url_launcher: ^6.3.2
  intl: ^0.19.0
  geolocator: ^10.1.0
  flutter_map: ^6.2.1
  latlong2: ^0.9.1
  fl_chart: ^0.70.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.jpg"
